services:
  postgres:
    image: postgres:16
    container_name: sangam_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sangam_db}
      POSTGRES_USER: ${POSTGRES_USER:-sangam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sangam_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sangam_user} -d ${POSTGRES_DB:-sangam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sangam_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sangam_user}:${POSTGRES_PASSWORD:-sangam_pass}@postgres:5432/${POSTGRES_DB:-sangam_db}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sangam_frontend
    restart: always
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
